<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cobbleware authentication</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="auth-page">
      <section class="card auth-card">
        <h1>Connect Cobbleware</h1>
        <p>Run this command in Minecraft:</p>
        <code id="command" class="command"></code>
        <p id="status" class="status" role="status" aria-live="polite">Waiting for authentication...</p>
      </section>
    </main>
    <script>
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      function randomCharacter() {
        const bytes = new Uint8Array(1);
        do {
          crypto.getRandomValues(bytes);
        } while (bytes[0] >= 252);
        return alphabet[bytes[0] % alphabet.length];
      }

      const code = Array.from({ length: 8 }, randomCharacter);
      const authCode = code.slice(0, 4).join('') + '-' + code.slice(4).join('');
      document.querySelector('#command').textContent = '/cobbleware auth ' + authCode;

      async function poll() {
        try {
          const response = await fetch('/playerapi/v1/authenticate', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ code: authCode }),
          });
          if (response.status === 201) {
            window.location.assign('/index.html');
            return;
          }
        } catch {
          // Retry on the next interval if the Runtime is temporarily unavailable.
        }
        window.setTimeout(poll, 1000);
      }

      poll();
    </script>
  </body>
</html>
