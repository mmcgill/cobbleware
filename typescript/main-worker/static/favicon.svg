<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
  aria-labelledby="title desc">
  <title id="title">Cobbleputer favicon</title>
  <desc
    id="desc">Head-on stylized Cobbleputer: brick and copper compute block with antenna, dial, vents, knobs, and indicator lights.</desc>

  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd0a3" />
      <stop offset=".16" stop-color="#eaa06b" />
      <stop offset=".42" stop-color="#bd6a3e" />
      <stop offset=".68" stop-color="#8f472b" />
      <stop offset=".86" stop-color="#d9824d" />
      <stop offset="1" stop-color="#f2b27b" />
    </linearGradient>
    <linearGradient id="darkCopper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c87042" />
      <stop offset=".45" stop-color="#9a4f31" />
      <stop offset="1" stop-color="#653323" />
    </linearGradient>
    <linearGradient id="brick1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5533c" />
      <stop offset=".45" stop-color="#843f31" />
      <stop offset="1" stop-color="#633126" />
    </linearGradient>
    <linearGradient id="brick2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b85f45" />
      <stop offset=".52" stop-color="#944633" />
      <stop offset="1" stop-color="#703427" />
    </linearGradient>
    <linearGradient id="brick3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f4738" />
      <stop offset=".5" stop-color="#76372d" />
      <stop offset="1" stop-color="#572b24" />
    </linearGradient>
    <linearGradient id="brick4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c16649" />
      <stop offset=".48" stop-color="#9b4c36" />
      <stop offset="1" stop-color="#73382a" />
    </linearGradient>
    <radialGradient id="amber" cx=".45" cy=".38" r=".65">
      <stop offset="0" stop-color="#fff3a0" />
      <stop offset=".35" stop-color="#ffc52f" />
      <stop offset="1" stop-color="#f07800" />
    </radialGradient>
    <radialGradient id="green" cx=".42" cy=".35" r=".65">
      <stop offset="0" stop-color="#e4ff9b" />
      <stop offset=".4" stop-color="#8dc63f" />
      <stop offset="1" stop-color="#3f6f1c" />
    </radialGradient>

    <pattern id="grillHatch" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9"
        fill="none" stroke="#9c5734" stroke-width="3" />
      <path d="M-3 9 L3 15 M0 0 L12 12 M9 -3 L15 3"
        fill="none" stroke="#6f3926" stroke-width="3" />
    </pattern>
  </defs>
  <!-- antenna -->
  <g stroke="#2a1d18" stroke-width="8" stroke-linejoin="round">
    <rect x="244" y="51" width="24" height="74" rx="11" fill="url(#copper)" />
    <rect x="249" y="119" width="14" height="39" rx="5" fill="#7d4129" />
    <ellipse cx="256" cy="165" rx="39" ry="14" fill="#5a3023" />
    <rect x="226" y="151" width="60" height="28" rx="10" fill="url(#copper)" />
  </g>
  <!-- brick border, top -->
  <g stroke="#3b2a22" stroke-width="7" stroke-linejoin="round">
    <rect x="84" y="169" width="78" height="45" rx="8" fill="url(#brick2)" />
    <rect x="166" y="169" width="82" height="45" rx="8" fill="url(#brick4)" />
    <rect x="252" y="169" width="87" height="45" rx="8" fill="url(#brick1)" />
    <rect x="343" y="169" width="85" height="45" rx="8" fill="url(#brick3)" />

    <!-- left column -->
    <rect x="84" y="218" width="62" height="66" rx="8" fill="url(#brick1)" />
    <rect x="84" y="288" width="62" height="70" rx="8" fill="url(#brick3)" />
    <rect x="84" y="362" width="62" height="89" rx="8" fill="url(#brick2)" />

    <!-- right column -->
    <rect x="366" y="218" width="62" height="66" rx="8" fill="url(#brick4)" />
    <rect x="366" y="288" width="62" height="70" rx="8" fill="url(#brick2)" />
    <rect x="366" y="362" width="62" height="89" rx="8" fill="url(#brick1)" />
  </g>

  <!-- copper corner caps -->
  <g fill="url(#copper)" stroke="#4b2b21" stroke-width="7">
    <rect x="78" y="164" width="56" height="56" rx="9" />
    <rect x="378" y="164" width="56" height="56" rx="9" />
    <rect x="78" y="399" width="56" height="56" rx="9" />
    <rect x="378" y="399" width="56" height="56" rx="9" />
  </g>

  <!-- center faceplate -->
  <rect x="143" y="214" width="226" height="239" rx="15" fill="url(#darkCopper)" stroke="#e6a06b"
    stroke-width="8" />

  <!-- upper vent -->
  <rect x="271" y="236" width="72" height="50" rx="7" fill="#151412" stroke="#e39a65"
    stroke-width="7" />
  <rect x="278" y="243" width="58" height="36" rx="3" fill="url(#grillHatch)" />

  <!-- gauge -->
  <circle cx="207" cy="265" r="46" fill="#3b2820" stroke="#e7a36e" stroke-width="8" />
  <circle cx="207" cy="265" r="34" fill="#d8bd8e" stroke="#2c211b" stroke-width="5" />
  <g stroke="#34271f" stroke-width="4" stroke-linecap="round">
    <line x1="187" y1="250" x2="181" y2="243" />
    <line x1="196" y1="242" x2="194" y2="232" />
    <line x1="207" y1="239" x2="207" y2="228" />
    <line x1="218" y1="242" x2="220" y2="232" />
    <line x1="227" y1="250" x2="233" y2="243" />
    <line x1="207" y1="265" x2="196" y2="246" />
  </g>
  <circle cx="207" cy="265" r="8" fill="#2c2520" />

  <!-- indicator lamps -->
  <g stroke="#3a2418" stroke-width="5">
    <circle cx="330" cy="308" r="14" fill="url(#amber)" />
    <circle cx="330" cy="342" r="10" fill="url(#amber)" />
    <circle cx="184" cy="341" r="10" fill="#2b351d" />
    <circle cx="256" cy="334" r="10" fill="url(#green)" />
  </g>

  <!-- knobs -->
  <g stroke="#3a241a" stroke-width="7">
    <circle cx="184" cy="385" r="26" fill="url(#copper)" />
    <circle cx="256" cy="385" r="26" fill="url(#copper)" />
    <circle cx="328" cy="385" r="26" fill="url(#copper)" />
  </g>
  <g stroke="#ffd0a3" stroke-width="4" stroke-linecap="round">
    <line x1="184" y1="365" x2="184" y2="378" />
    <line x1="256" y1="365" x2="256" y2="378" />
    <line x1="328" y1="365" x2="328" y2="378" />
  </g>

  <!-- lower vent -->
  <rect x="166" y="419" width="180" height="31" rx="6" fill="#151412" stroke="#e39a65"
    stroke-width="7" />
  <rect x="173" y="426" width="166" height="17" rx="2" fill="url(#grillHatch)" />

  <!-- rivets -->
  <g fill="#5b3023" stroke="#e3a06d" stroke-width="3">
    <circle cx="157" cy="228" r="5" />
    <circle cx="355" cy="228" r="5" />
    <circle cx="157" cy="440" r="5" />
    <circle cx="355" cy="440" r="5" />
    <circle cx="104" cy="192" r="5" />
    <circle cx="408" cy="192" r="5" />
    <circle cx="104" cy="427" r="5" />
    <circle cx="408" cy="427" r="5" />
  </g>
</svg>
