<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cobbleware authentication</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  </head>
  <body>
    <main class="auth-page">
      <section class="card auth-card">
        <h1>Connect Cobbleware</h1>
        <p>Run this command in Minecraft:</p>
        <code id="command" class="command"></code>
        <p id="status" class="status" role="status"
          aria-live="polite">Waiting for authentication...</p>
      </section>
    </main>
    <script type="module" src="./auth.ts"></script>
  </body>
</html>
