edition = "2024";

package cobbleware.internal;

import "common.proto";
import "effects.proto";
import "events.proto";

// The lifecycle state of an execution.
enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_RUNNING = 1;
  EXECUTION_STATUS_STOPPED = 2;
  EXECUTION_STATUS_CRASHED = 3;
}

message ExecutionState {
  // Identifies an execution. Required by the application contract.
  cobbleware.common.Uuid execution_id = 1;
  // The state of the execution immediately before processing the first pending event.
  // Required by the application contract.
  bytes initial_state = 2;
  // The pending events for this execution. Required by the application contract.
  repeated cobbleware.events.Event events = 3;
  // The sequence number of the first pending event.
  // Required by the application contract.
  uint64 event_seq_num = 4;
  // The sequence number of the last applied effect from this execution.
  // Required by the application contract.
  uint64 effect_seq_num = 5;
  // Identifies the player whose active program owns this execution.
  // Required by the application contract.
  cobbleware.common.Uuid player_id = 6;
  // The execution lifecycle state. Required by the application contract.
  ExecutionStatus state = 7;
}

message ExecutionResult {
  // Identifies an execution. Required by the application contract.
  cobbleware.common.Uuid execution_id = 1;
  // The state of the execution after consuming all events up to and including event_seq_num.
  // Required by the application contract.
  bytes final_state = 2;
  // The unapplied effects that result from processing all events up to and including event_seq_num.
  // Required by the application contract.
  repeated cobbleware.effects.Effect effects = 3;
  // Sequence number of the last consumed event, whose output state was final_state.
  // Required by the application contract.
  uint64 event_seq_num = 4;
  // Sequence number of the first effect.
  // Required by the application contract.
  uint64 effect_seq_num = 5;
  // The execution lifecycle state. Required by the application contract.
  ExecutionStatus state = 6;
}

message ExecutionsRequest {
  // Required by the application contract.
  repeated ExecutionState executions = 1;
}

message ExecutionsResponse {
  // Required by the application contract.
  repeated ExecutionResult results = 1;
}

// The types of events recorded by execution instrumentation.
enum InstrumentationEventType {
  INSTRUMENTATION_EVENT_TYPE_UNSPECIFIED = 0;
  INSTRUMENTATION_EVENT_TYPE_STARTED = 1;
  INSTRUMENTATION_EVENT_TYPE_RESUMED = 2;
  INSTRUMENTATION_EVENT_TYPE_CHAT_MESSAGE = 3;
  INSTRUMENTATION_EVENT_TYPE_BLOCK_STATE_CHANGE = 4;
  INSTRUMENTATION_EVENT_TYPE_WIRELESS_OBSERVER_PAIRED = 5;
  INSTRUMENTATION_EVENT_TYPE_WIRELESS_OBSERVER_UNPAIRED = 6;
}

// The types of effects recorded by execution instrumentation.
enum InstrumentationEffectType {
  INSTRUMENTATION_EFFECT_TYPE_UNSPECIFIED = 0;
  INSTRUMENTATION_EFFECT_TYPE_SEND_CHAT = 1;
  INSTRUMENTATION_EFFECT_TYPE_EMIT_BEEP = 2;
  INSTRUMENTATION_EFFECT_TYPE_SET_REDSTONE_POWER = 3;
}

// The lifecycle states represented in an instrumentation state gauge.
enum InstrumentationLifecycleState {
  INSTRUMENTATION_LIFECYCLE_STATE_UNSPECIFIED = 0;
  INSTRUMENTATION_LIFECYCLE_STATE_RUNNING = 1;
  INSTRUMENTATION_LIFECYCLE_STATE_STOPPED = 2;
}

// One raw execution-instrumentation bucket finalized by the Mod at the end of a server tick.
// It is sent by the Mod to the Main Worker and is not persisted.
message ExecutionStatsTick {
  // Wall-clock time at which the Mod finalized this tick, as milliseconds since the Unix epoch.
  // Required by the application contract.
  uint64 sampled_at_unix_millis = 1;
  // Monotonically increasing, process-local Mod tick sequence number. Required by the application contract.
  uint64 tick_sequence = 2;
  // Contains at most one entry for each player. Entries are raw per-tick measurements, not window aggregates.
  repeated PlayerStats players = 3;

  // Identifies the physical Cobbleputer to which a raw measurement belongs.
  message CobbleputerRef {
    cobbleware.common.Uuid cobbleputer_id = 1;
    cobbleware.common.GlobalPos position = 2;
  }

  // A player's raw instrumentation for this tick.
  message PlayerStats {
    // Identifies the player whose metrics are represented. Required by the application contract.
    cobbleware.common.Uuid player_id = 1;
    // used_bytes and max_bytes are 0 in messages from the Mod; these fields are only used by the runtime.
    uint64 used_bytes = 6;
    uint64 max_bytes = 7;
    repeated EventMeasurement events = 2;
    repeated EventsPerSyncMeasurement events_per_sync = 3;
    repeated EffectMeasurement effects = 4;
    repeated CobbleputerState cobbleputer_states = 5;
  }

  message EventMeasurement {
    CobbleputerRef cobbleputer = 1;
    InstrumentationEventType type = 2;
    uint64 accepted = 3;
    uint64 dropped = 4;
  }

  message EventsPerSyncMeasurement {
    CobbleputerRef cobbleputer = 1;
    uint64 count = 2;
    uint64 total = 3;
    uint64 max = 4;
  }

  message EffectMeasurement {
    CobbleputerRef cobbleputer = 1;
    InstrumentationEffectType type = 2;
    uint64 attempted = 3;
    uint64 failed = 4;
    uint64 total_nanos = 5;
    uint64 max_nanos = 6;
  }

  message CobbleputerState {
    CobbleputerRef cobbleputer = 1;
    InstrumentationLifecycleState state = 2;
  }
}

// An error returned by an internal Mod API endpoint.
message ErrorResponse {
  string error = 1;
}

////////////// Execution Logs ///////////////

// Maps to an UncaughtException event (as sent to an Edge Runtime event worker).
message ExceptionLogEntry {
  string msg = 1;
  uint64 cpu_time_used = 2;
}

// Maps to a subset of ShutdownEvent (as sent to an Edge Runtime event worker)
// that applies when the ShutdownEvent's reason is CPUTime or Memory.
message LimitExceededLogEntry {
  string reason = 1;
  uint64 cpu_time_used = 2;
  uint64 total_mem_used = 3;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 5;
  LOG_LEVEL_INFO = 10;
  LOG_LEVEL_WARN = 15;
  LOG_LEVEL_ERROR = 20;
}

// Maps to a Log event (as sent to an Edge Runtime event worker).
message ProgramLogEntry {
  LogLevel level = 1;
  string msg = 2;
}

message ExecutionLogEntry {
  cobbleware.common.Uuid player_id = 1;
  oneof inner {
    ExceptionLogEntry exception = 2;
    LimitExceededLogEntry limited = 3;
    ProgramLogEntry log = 4;
  }
}

