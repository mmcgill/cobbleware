edition = "2024";

package cobbleware.internal;

import "common.proto";
import "effects.proto";
import "events.proto";

// The lifecycle state of an execution.
enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_RUNNING = 1;
  EXECUTION_STATUS_STOPPED = 2;
  EXECUTION_STATUS_CRASHED = 3;
}

// Explains a terminal execution result when the Runtime can identify its cause.
enum ExecutionFailureReason {
  EXECUTION_FAILURE_REASON_UNSPECIFIED = 0;
  EXECUTION_FAILURE_REASON_STATE_SIZE_LIMIT = 1;
  // The raw program response body exceeded the configured execution-sync limit.
  EXECUTION_FAILURE_REASON_STEP_RESPONSE_SIZE_LIMIT = 2;
}

message ExecutionState {
  // Identifies an execution. Required by the application contract.
  cobbleware.common.Uuid execution_id = 1;
  // The state of the execution immediately before processing the first pending event.
  // Required by the application contract.
  bytes initial_state = 2;
  // The pending events for this execution. Required by the application contract.
  repeated cobbleware.events.Event events = 3;
  // The sequence number of the first pending event.
  // Required by the application contract.
  uint64 event_seq_num = 4;
  // Maximum final-state size the Runtime may accept for this execution in this snapshot.
  // Required by the application contract; zero permits only an empty final state.
  uint64 state_size_limit = 5;
  // Soft limit on outstanding effects for this execution. Required by the application contract.
  uint32 outbox_limit = 6;
}

message PlayerExecutionState {
  // Identifies the player whose active program owns these executions.
  // Required by the application contract.
  cobbleware.common.Uuid player_id = 1;
  repeated ExecutionState executions = 2;
  // Soft limit on total outstanding effects for this player. Required by the application contract.
  uint32 outstanding_effect_limit = 3;
  // Configured cap on all of this player's durable execution-state byte arrays. Required by the application contract.
  uint64 total_execution_state_limit = 4;
  // The Mod-authoritative number of available burst chat tokens. Required by the application contract.
  uint32 burst_chat_tokens = 5;
  // The Mod-authoritative number of available slow chat tokens. Required by the application contract.
  uint32 slow_chat_tokens = 6;
}

message ExecutionsRequest {
  // Required by the application contract.
  repeated PlayerExecutionState players = 1;
  // Maximum number of open player workers. Required by the application contract.
  uint32 worker_limit = 2;
}

message ExecutionResult {
  // Identifies an execution. Required by the application contract.
  cobbleware.common.Uuid execution_id = 1;
  // The state of the execution after consuming all events up to and including event_seq_num.
  // Required by the application contract.
  bytes final_state = 2;
  // The unapplied effects that result from processing all events up to and including event_seq_num.
  // Required by the application contract.
  repeated cobbleware.effects.Effect effects = 3;
  // Sequence number of the last consumed event, whose output state was final_state.
  // Required by the application contract.
  uint64 event_seq_num = 4;
  // True if the execution failed when attempting step beyond event_seq_num.
  // Required by the application contract.
  bool execution_failed = 5;
  // Identifies a Runtime-enforced terminal failure when known.
  ExecutionFailureReason failure_reason = 7;
}

message ExecutionsResponse {
  // Required by the application contract.
  repeated ExecutionResult results = 1;
}

// Durable execution records for one player. This message is stored only by the
// Mod in cobbleware-data/executions/<player-uuid>.pb; it is not part of the
// Mod/Main Worker execution-sync protocol.
message PlayerExecutionStates {
  // Version of this file format. Required by the application contract.
  uint32 format_version = 1;
  repeated StoredExecutionState executions = 2;
  // Current per-player burst chat tokens. Present in format version 2 and later.
  uint32 burst_chat_tokens = 3;
  // Current per-player slow chat tokens. Present in format version 2 and later.
  uint32 slow_chat_tokens = 4;
  // Minecraft game time at which the next slow token becomes available. Present in format version 2 and later.
  uint64 next_slow_chat_refill_tick = 5;
  // Minecraft game time at which a slow token may move to the burst bucket. Present in format version 2 and later.
  uint64 next_burst_chat_transfer_tick = 6;
}

// One Cobbleputer's durable execution record in a PlayerExecutionStates file.
message StoredExecutionState {
  // Identifies the physical Cobbleputer. Required by the application contract.
  cobbleware.common.Uuid cobbleputer_id = 1;
  // Absent for a crashed execution, which retains its owner and state for restart.
  cobbleware.common.Uuid execution_id = 2;
  // Former owner_player_name field. New records use the Cobbleware UUID-keyed name cache instead.
  reserved 3;
  bytes execution_state = 4;
  uint64 next_event_sequence_num = 5;
  uint64 effect_sequence_num = 6;
  uint64 stopped_at_tick = 7;
  bool was_running_when_unloaded = 8;
}

// The types of events recorded by execution instrumentation.
enum InstrumentationEventType {
  INSTRUMENTATION_EVENT_TYPE_UNSPECIFIED = 0;
  INSTRUMENTATION_EVENT_TYPE_STARTED = 1;
  INSTRUMENTATION_EVENT_TYPE_RESUMED = 2;
  INSTRUMENTATION_EVENT_TYPE_CHAT_MESSAGE = 3;
  INSTRUMENTATION_EVENT_TYPE_BLOCK_STATE_CHANGE = 4;
  INSTRUMENTATION_EVENT_TYPE_WIRELESS_OBSERVER_PAIRED = 5;
  INSTRUMENTATION_EVENT_TYPE_WIRELESS_OBSERVER_UNPAIRED = 6;
}

// The types of effects recorded by execution instrumentation.
enum InstrumentationEffectType {
  INSTRUMENTATION_EFFECT_TYPE_UNSPECIFIED = 0;
  INSTRUMENTATION_EFFECT_TYPE_SEND_CHAT = 1;
  INSTRUMENTATION_EFFECT_TYPE_SET_REDSTONE_POWER = 3;
}

// The lifecycle states represented in an instrumentation state gauge.
enum InstrumentationLifecycleState {
  INSTRUMENTATION_LIFECYCLE_STATE_UNSPECIFIED = 0;
  INSTRUMENTATION_LIFECYCLE_STATE_RUNNING = 1;
  INSTRUMENTATION_LIFECYCLE_STATE_STOPPED = 2;
}

// One raw execution-instrumentation bucket finalized by the Mod at the end of a server tick.
// It is sent by the Mod to the Main Worker and is not persisted.
message ExecutionStatsTick {
  // Wall-clock time at which the Mod finalized this tick, as milliseconds since the Unix epoch.
  // Required by the application contract.
  uint64 sampled_at_unix_millis = 1;
  // Monotonically increasing, process-local Mod tick sequence number. Required by the application contract.
  uint64 tick_sequence = 2;
  // Contains at most one entry for each player. Entries are raw per-tick measurements, not window aggregates.
  repeated PlayerStats players = 3;

  // Identifies the physical Cobbleputer to which a raw measurement belongs.
  message CobbleputerRef {
    cobbleware.common.Uuid cobbleputer_id = 1;
    cobbleware.common.GlobalPos position = 2;
  }

  // A player's raw instrumentation for this tick.
  message PlayerStats {
    // Identifies the player whose metrics are represented. Required by the application contract.
    cobbleware.common.Uuid player_id = 1;
    // used_bytes and max_bytes are 0 in messages from the Mod; these fields are only used by the runtime.
    uint64 used_bytes = 6;
    uint64 max_bytes = 7;
    // The Mod-authoritative current number of available burst chat tokens. This is instantaneous, not a window aggregate.
    uint32 burst_chat_tokens = 8;
    // The Mod-authoritative current number of available slow chat tokens. This is instantaneous, not a window aggregate.
    uint32 slow_chat_tokens = 9;
    // The Event Worker-authoritative current program-log token bucket. It is present exactly when
    // log_tokens_available is true and is refreshed independently of the Mod's tick measurements.
    LogTokenBucket log_tokens = 10;
    // Maximum burst chat tokens. Required by the application contract.
    uint32 max_burst_chat_tokens = 11;
    // Maximum slow chat tokens. Required by the application contract.
    uint32 max_slow_chat_tokens = 12;
    // True when log_tokens contains the Event Worker's current program-log bucket. False means it is unavailable.
    // This field is set only by the Main Worker in player-scoped Browser copies of this message.
    bool log_tokens_available = 13;
    // The Mod-authoritative current number of loaded running executions. Required by the application contract.
    uint32 running_executions = 14;
    // Maximum concurrently running executions for this player. Required by the application contract.
    uint32 max_running_executions = 15;
    // Maximum total durable execution-state bytes for this player. Required by the application contract.
    uint64 max_total_execution_state_bytes = 16;
    repeated EventMeasurement events = 2;
    repeated EventsPerSyncMeasurement events_per_sync = 3;
    repeated EffectMeasurement effects = 4;
    repeated CobbleputerState cobbleputer_states = 5;
  }

  message EventMeasurement {
    CobbleputerRef cobbleputer = 1;
    InstrumentationEventType type = 2;
    uint64 accepted = 3;
    uint64 dropped = 4;
  }

  message EventsPerSyncMeasurement {
    CobbleputerRef cobbleputer = 1;
    uint64 count = 2;
    uint64 total = 3;
    uint64 max = 4;
  }

  message EffectMeasurement {
    CobbleputerRef cobbleputer = 1;
    InstrumentationEffectType type = 2;
    uint64 attempted = 3;
    uint64 failed = 4;
    uint64 total_nanos = 5;
    uint64 max_nanos = 6;
  }

  message CobbleputerState {
    CobbleputerRef cobbleputer = 1;
    InstrumentationLifecycleState state = 2;
    // The current durable execution-state byte-array length.
    uint64 state_size_bytes = 3;
  }
}

// An error returned by an internal Mod API endpoint.
message ErrorResponse {
  string error = 1;
}

////////////// Execution Logs ///////////////

// Maps to an UncaughtException event (as sent to an Edge Runtime event worker).
message ExceptionLogEntry {
  string msg = 1;
  uint64 cpu_time_used = 2;
}

// Maps to a subset of ShutdownEvent (as sent to an Edge Runtime event worker)
// that applies when the ShutdownEvent's reason is CPUTime or Memory.
message LimitExceededLogEntry {
  string reason = 1;
  uint64 cpu_time_used = 2;
  uint64 total_mem_used = 3;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 5;
  LOG_LEVEL_INFO = 10;
  LOG_LEVEL_WARN = 15;
  LOG_LEVEL_ERROR = 20;
}

// Maps to a Log event (as sent to an Edge Runtime event worker).
message ProgramLogEntry {
  LogLevel level = 1;
  string msg = 2;
}

// The Event Worker's current program-log allowance for one player. The available value may be fractional because the
// bucket refills continuously.
message LogTokenBucket {
  double available = 1;
  uint32 capacity = 2;
}

// The Event Worker's current program-log allowance for one player. It is sent to the Main Worker as telemetry and
// merged into that player's next ExecutionStatsTick.PlayerStats snapshot.
message LogStats {
  cobbleware.common.Uuid player_id = 1;
  LogTokenBucket log_tokens = 2;
}

enum ExecutionTransition {
  EXECUTION_TRANSITION_UNSPECIFIED = 0;
  EXECUTION_TRANSITION_STARTED = 1;
  EXECUTION_TRANSITION_STOPPED = 2;
  EXECUTION_TRANSITION_RESUMED = 3;
  EXECUTION_TRANSITION_CRASHED = 4;
}

message ExecutionTransitionLogEntry {
  cobbleware.common.Uuid execution_id = 1;
  ExecutionTransition transition = 2;
  uint32 execution_count = 3;
  uint32 execution_limit = 4;
  uint64 total_execution_state_limit = 5;
}

enum ExecutionPoolTransition {
  // No execution-pool state was specified.
  EXECUTION_POOL_TRANSITION_UNSPECIFIED = 0;
  // The player occupies a guaranteed-pool slot.
  EXECUTION_POOL_TRANSITION_GUARANTEED = 1;
  // The player occupies an active best-effort-pool slot.
  EXECUTION_POOL_TRANSITION_BESTEFFORT = 2;
  // The player is eligible but waiting for a best-effort-pool slot.
  EXECUTION_POOL_TRANSITION_WAITING = 3;
  // The player has no loaded running Cobbleputers and is not eligible for a pool.
  EXECUTION_POOL_TRANSITION_NONE = 4;
}

// Records the owner's resulting execution-pool state.
message ExecutionPoolTransitionLogEntry {
  ExecutionPoolTransition transition = 1;
}

message ExecutionLogEntry {
  cobbleware.common.Uuid player_id = 1;
  oneof inner {
    ExceptionLogEntry exception = 2;
    LimitExceededLogEntry limited = 3;
    ProgramLogEntry log = 4;
    ExecutionTransitionLogEntry transition = 5;
    ExecutionPoolTransitionLogEntry pool_transition = 6;
  }
}
