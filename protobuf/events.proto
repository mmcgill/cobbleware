edition = "2024";

package cobbleware.events;

import "common.proto";

// The Program has started executing.
message Started {
  uint64 tick = 1;
}

message Resumed {
  uint64 stop_tick = 1;
  uint64 resume_tick = 2;
}

message ChatMessage {
  string message = 1;
}

// A single event supplied to a program step.
message Event {
  oneof event {
    Started started = 1;
    Resumed resumed = 2;
    ChatMessage chat_message = 3;
  }
}
