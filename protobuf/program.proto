edition = "2024";

package cobbleware.program;

import "common.proto";
import "effects.proto";
import "events.proto";

message StartState {
  // Required by the application contract.
  string state_name = 1;
  // Required by the application contract.
  bytes state = 2;
}

message StartStatesResponse {
  repeated StartState start_states = 1;
}

message StepRequest {
  // Required by the application contract.
  cobbleware.common.Uuid puter_id = 1;
  // Required by the application contract.
  bytes state = 2;
  // Required by the application contract.
  cobbleware.events.Event event = 3;
}

message StepResponse {
  // Required by the application contract.
  bytes state = 1;
  // Required by the application contract.
  repeated cobbleware.effects.Effect effects = 2;
}

message ErrorResponse {
  // Required by the application contract.
  string error = 1;
}
