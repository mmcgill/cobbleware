edition = "2024";

package cobbleware.program;

import "common.proto";
import "effects.proto";
import "events.proto";

message StartState {
  // Required by the application contract.
  string state_name = 1;
  // Required by the application contract.
  bytes state = 2;
}

message StartStatesResponse {
  repeated StartState start_states = 1;
}

message StepRequest {
  // Required by the application contract.
  cobbleware.common.Uuid execution_id = 1;
  // Required by the application contract.
  bytes state = 2;
  // Required by the application contract.
  cobbleware.events.Event event = 3;
  // The maximum number of effects the Runtime will accept from this step.
  uint32 effect_limit = 4;
  // The maximum size in bytes the Runtime will accept for the next execution state.
  uint64 state_size_limit = 5;
  // The Mod's current number of available per-player burst chat tokens.
  uint32 burst_chat_tokens = 6;
  // The Mod's current number of available per-player slow chat tokens.
  uint32 slow_chat_tokens = 7;
}

message StepResponse {
  // Required by the application contract.
  bytes state = 1;
  // Required by the application contract.
  repeated cobbleware.effects.Effect effects = 2;
}

message ErrorResponse {
  // Required by the application contract.
  string error = 1;
}
