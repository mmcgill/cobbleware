edition = "2024";

package cobbleware.effects;

import "common.proto";

message SendChat {
  // Required by the application contract.
  string msg = 1;
}

message EmitBeep {
  // The original FlatBuffers uint16 value. Values above 65535 are invalid.
  uint32 millis = 1;
}

message SetRedstonePower {
  // When set, identifies the specific observer whose power level is modified.
  cobbleware.common.Uuid observer_id = 1;
  // When set, only wireless observers of this color have power levels modified.
  cobbleware.common.DyeColor observer_color = 3;
  // Clamped to 15
  uint32 power_level = 2;
}

// A single effect produced by a program step.
message Effect {
  oneof effect {
    SendChat send_chat = 1;
    EmitBeep emit_beep = 2;
    SetRedstonePower set_redstone_power = 3;
  }
}
