edition = "2024";

package cobbleware.common;

// Shared value types used by Cobbleware's public and internal APIs.
message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Vec3i {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message ChunkPos {
  int32 x = 1;
  int32 z = 2;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DOWN = 1;
  DIRECTION_UP = 2;
  DIRECTION_NORTH = 3;
  DIRECTION_SOUTH = 4;
  DIRECTION_WEST = 5;
  DIRECTION_EAST = 6;
}

message Identifier {
  string ns = 1;
  string path = 2;
}

message GlobalPos {
  Identifier dimension = 1;
  Vec3i position = 2;
}

message Uuid {
  // The upper and lower 64 bits of an opaque UUID value.
  uint64 high = 1;
  uint64 low = 2;
}

enum DyeColor {
  DYE_COLOR_UNSPECIFIED = 0;
  DYE_COLOR_WHITE = 1;
  DYE_COLOR_ORANGE = 2;
  DYE_COLOR_MAGENTA = 3;
  DYE_COLOR_LIGHT_BLUE = 4;
  DYE_COLOR_YELLOW = 5;
  DYE_COLOR_LIME = 6;
  DYE_COLOR_PINK = 7;
  DYE_COLOR_GRAY = 8;
  DYE_COLOR_LIGHT_GRAY = 9;
  DYE_COLOR_CYAN = 10;
  DYE_COLOR_PURPLE = 11;
  DYE_COLOR_BLUE = 12;
  DYE_COLOR_BROWN = 13;
  DYE_COLOR_GREEN = 14;
  DYE_COLOR_RED = 15;
  DYE_COLOR_BLACK = 16;
}
