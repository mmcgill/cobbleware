edition = "2024";

package cobbleware.common;

// Double-precision 3d point/vector.
message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Integer 3d point/vector.
message Vec3i {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

// Two-dimensional chunk position, as (x,z).
message ChunkPos {
  int32 x = 1;
  int32 z = 2;
}

// The 6 Minecraft dimensions.
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DOWN = 1;
  DIRECTION_UP = 2;
  DIRECTION_NORTH = 3;
  DIRECTION_SOUTH = 4;
  DIRECTION_WEST = 5;
  DIRECTION_EAST = 6;
}

// A namespace-qualified Minecraft path for identifying block types, dimensions, etc.
message Identifier {
  string ns = 1;
  string path = 2;
}

// Globally identifies a block position via dimension and integer offsets.
message GlobalPos {
  // Minecraft server identifier for a dimension.
  Identifier dimension = 1;
  // Position within the given dimension.
  Vec3i position = 2;
}

// A UUID given as high and low longs.
message Uuid {
  // The upper 64 bits of an opaque UUID value.
  uint64 high = 1;
  // The lower 64 bits of an opaque UUID value.
  uint64 low = 2;
}

// The 16 Minecraft Dye colors.
enum DyeColor {
  DYE_COLOR_UNSPECIFIED = 0;
  DYE_COLOR_WHITE = 1;
  DYE_COLOR_ORANGE = 2;
  DYE_COLOR_MAGENTA = 3;
  DYE_COLOR_LIGHT_BLUE = 4;
  DYE_COLOR_YELLOW = 5;
  DYE_COLOR_LIME = 6;
  DYE_COLOR_PINK = 7;
  DYE_COLOR_GRAY = 8;
  DYE_COLOR_LIGHT_GRAY = 9;
  DYE_COLOR_CYAN = 10;
  DYE_COLOR_PURPLE = 11;
  DYE_COLOR_BLUE = 12;
  DYE_COLOR_BROWN = 13;
  DYE_COLOR_GREEN = 14;
  DYE_COLOR_RED = 15;
  DYE_COLOR_BLACK = 16;
}
