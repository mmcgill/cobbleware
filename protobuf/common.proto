edition = "2024";

package cobbleware.common;

// Shared value types used by Cobbleware's public and internal APIs.
message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Vec3i {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message ChunkPos {
  int32 x = 1;
  int32 z = 2;
}

enum Direction {
  DOWN = 0;
  UP = 1;
  NORTH = 2;
  SOUTH = 3;
  WEST = 4;
  EAST = 5;
}

message Identifier {
  string ns = 1;
  string path = 2;
}

message GlobalPos {
  Identifier dimension = 1;
  Vec3i position = 2;
}

message Uuid {
  int64 high = 1;
  int64 low = 2;
}

enum DyeColor {
  WHITE = 0;
  ORANGE = 1;
  MAGENTA = 2;
  LIGHT_BLUE = 3;
  YELLOW = 4;
  LIME = 5;
  PINK = 6;
  GRAY = 7;
  LIGHT_GRAY = 8;
  CYAN = 9;
  PURPLE = 10;
  BLUE = 11;
  BROWN = 12;
  GREEN = 13;
  RED = 14;
  BLACK = 15;
}