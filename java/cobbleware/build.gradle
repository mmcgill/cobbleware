plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.google.protobuf' version "${protobuf_gradle_plugin_version}"
    id 'com.diffplug.spotless' version '8.10.2'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.nucleoid.xyz' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    implementation "eu.pb4:polymer-core:${project.polymer_version}"
    implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    implementation "eu.pb4:polymer-blocks:${project.polymer_version}"
    runtimeOnly "eu.pb4:polymer-autohost:${project.polymer_version}"

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        server {
            runDir 'run'
        }
        alice {
            client()
            name 'Alice'
            runDir 'run/alice'
            programArgs '--username', 'Alice'
        }
        bob {
            client()
            name 'Bob'
            runDir 'run/bob'
            programArgs '--username', 'Bob'
        }
    }
}

def developmentServerProperties = layout.projectDirectory.file('run/server.properties')

tasks.register('configureDevelopmentServer') {
    group = 'fabric'
    description = 'Configures the development server to accept offline-mode players.'
    outputs.file(developmentServerProperties)

    doLast {
        File propertiesFile = developmentServerProperties.asFile
        if (!propertiesFile.isFile()) {
            propertiesFile.parentFile.mkdirs()
        }

        String contents = propertiesFile.isFile() ? propertiesFile.getText('UTF-8') : ''
        if (contents =~ /(?m)^online-mode=[^\r\n]*/) {
            contents = contents.replaceFirst(/(?m)^online-mode=[^\r\n]*/, 'online-mode=false')
        } else {
            String newline = contents.contains('\r\n') ? '\r\n' : '\n'
            contents += (contents.isEmpty() || contents.endsWith(newline) ? '' : newline) + 'online-mode=false' + newline
        }
        propertiesFile.setText(contents, 'UTF-8')
    }
}

tasks.named('runServer') {
    dependsOn(tasks.named('configureDevelopmentServer'))
}

def repositoryRoot = project.projectDir.toPath().resolve('../..').normalize().toFile()
def edgeRuntimeDirectory = new File(repositoryRoot, 'mc-edge-runtime')
def typescriptDirectory = new File(repositoryRoot, 'typescript')
def mainWorkerDirectory = new File(typescriptDirectory, 'main-worker')
def eventWorkerDirectory = new File(typescriptDirectory, 'event-worker')
// Update this pin only from a published, non-draft Runtime release after reviewing compatibility with the workers.
// Gradle deliberately does not query GitHub: the release JAR must contain its reviewed release identity and digests.
def runtimeRelease = [
        repository: 'mmcgill/cobbleware',
        tag: 'edge-runtime-1b87488c4cff',
        platforms: [
                'windows-x86_64': [
                        asset: 'edge-runtime-windows-x86_64.exe',
                        sha256: '446d7ed8f7cc017bd00c1136607861d0542c16c5352595889e87ed0125c721e6',
                ],
                'linux-x86_64': [
                        asset: 'edge-runtime-linux-x86_64',
                        sha256: '7323da0888d00e136015bb5cc551f61a54d4ac326eeba281a926177884000855',
                ],
        ],
]
def hostOs = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
def hostPlatform = hostOs.contains('windows') ? 'windows-x86_64' : hostOs.contains('linux') ? 'linux-x86_64' : null
if (hostPlatform == null) {
    throw new GradleException("Cobbleware development Runtime is unsupported on ${System.getProperty('os.name')}")
}
def hostRuntimeFileName = hostPlatform.startsWith('windows-') ? 'edge-runtime.exe' : 'edge-runtime'
def localRuntimeBinary = new File(edgeRuntimeDirectory, "target/release-small/${hostRuntimeFileName}")
def releaseWorkersDirectory = layout.buildDirectory.dir('generated/cobbleware-release/workers')
def releaseStaticDirectory = layout.buildDirectory.dir('generated/cobbleware-release/static')
def mainWorkerEszip = releaseWorkersDirectory.map { it.file('main-worker.eszip') }
def eventWorkerEszip = releaseWorkersDirectory.map { it.file('event-worker.eszip') }
def runtimeManifest = layout.buildDirectory.file('generated/cobbleware-release/manifest/manifest.json')
def releaseResourcesDirectory = layout.buildDirectory.dir('generated/cobbleware-release-v2/resources')
def downloadedHostRuntime = layout.buildDirectory.file("generated/cobbleware-runtime-bundler/${hostRuntimeFileName}")
def useLocalRuntime = providers.gradleProperty('useLocalRuntime')
        .map { value -> value.isEmpty() || value.toBoolean() }
        .orElse(false)

def edgeRuntimeSources = fileTree(edgeRuntimeDirectory) {
    include 'Cargo.lock'
    include 'Cargo.toml'
    include 'cli/**'
    include 'crates/**'
    include 'deno/**'
    include 'ext/**'
    include 'rusty_v8/**'
    include 'vendor/**'
    include 'scripts/**'
    exclude 'target/**'
    exclude '.git/**'
}

def typescriptSources = fileTree(typescriptDirectory) {
    exclude '**/node_modules/**'
    exclude '**/main-worker/static/**'
    exclude '**/*.eszip'
    exclude '**/.cobbleware-eszip-*/**'
}

def buildHostEdgeRuntime = tasks.register('buildHostEdgeRuntime', Exec) {
    group = 'distribution'
    description = 'Builds the host Edge Runtime binary used for worker bundling.'
    workingDir(edgeRuntimeDirectory)
    inputs.files(edgeRuntimeSources)
    inputs.property('targetPlatform', hostPlatform)
    outputs.file(localRuntimeBinary)
    if (hostPlatform.startsWith('windows-')) {
        commandLine(
                'cmd.exe',
                '/d',
                '/s',
                '/c',
                'call scripts\\windows-env.cmd && cargo build --profile release-small --package cli --bin edge-runtime --no-default-features --features tracing')
    } else {
        commandLine('cargo', 'build', '--profile', 'release-small', '--package', 'cli', '--bin', 'edge-runtime', '--no-default-features', '--features', 'tracing')
    }
}

def downloadPinnedHostRuntime = tasks.register('downloadPinnedHostRuntime') {
    group = 'distribution'
    description = 'Downloads the pinned host Runtime used to bundle worker ESZips.'
    def specification = runtimeRelease.platforms[hostPlatform]
    inputs.property('releaseRepository', runtimeRelease.repository)
    inputs.property('releaseTag', runtimeRelease.tag)
    inputs.property('asset', specification.asset)
    inputs.property('sha256', specification.sha256)
    outputs.file(downloadedHostRuntime)
    outputs.upToDateWhen { false }

    doLast {
        def sha256 = { File file ->
            byte[] digest = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes)
            digest.collect { byte value -> String.format('%02x', value & 0xff) }.join()
        }
        def makeExecutable = { File file ->
            if (!hostPlatform.startsWith('windows-') && !file.setExecutable(true)) {
                throw new GradleException("Could not mark pinned Runtime executable: ${file}")
            }
        }
        File destination = downloadedHostRuntime.get().asFile
        if (destination.isFile() && sha256(destination) == specification.sha256) {
            makeExecutable(destination)
            return
        }
        destination.parentFile.mkdirs()
        File temporary = new File(destination.parentFile, "${destination.name}.tmp-${java.util.UUID.randomUUID()}")
        String url = "https://github.com/${runtimeRelease.repository}/releases/download/${runtimeRelease.tag}/${specification.asset}"
        try {
            java.net.HttpURLConnection connection = (java.net.HttpURLConnection) new URL(url).openConnection()
            connection.instanceFollowRedirects = true
            connection.connectTimeout = 15_000
            connection.readTimeout = 300_000
            if (connection.responseCode != 200) {
                throw new GradleException("Pinned Runtime download returned HTTP ${connection.responseCode}")
            }
            temporary.withOutputStream { output ->
                connection.inputStream.withCloseable { input ->
                    input.transferTo(output)
                }
            }
            if (sha256(temporary) != specification.sha256) {
                throw new GradleException('Downloaded Runtime checksum does not match the pinned release')
            }
            java.nio.file.Files.move(
                    temporary.toPath(),
                    destination.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            makeExecutable(destination)
        } finally {
            temporary.delete()
        }
    }
}

def runtimeForBundling = useLocalRuntime.get() ? localRuntimeBinary : downloadedHostRuntime.get().asFile
def prepareRuntimeForBundling = useLocalRuntime.get() ? buildHostEdgeRuntime : downloadPinnedHostRuntime

def bundleMainWorker = tasks.register('bundleMainWorkerEszip', Exec) {
    group = 'distribution'
    description = 'Bundles the Main Worker and Browser UI into an ESZip for releaseBuild.'
    dependsOn(prepareRuntimeForBundling)
    workingDir(mainWorkerDirectory)
    inputs.files(typescriptSources, runtimeForBundling)
    outputs.file(mainWorkerEszip)
    outputs.dir(releaseStaticDirectory)
    environment('EDGE_RUNTIME_BIN', runtimeForBundling.absolutePath)
    commandLine(
            'deno',
            'run',
            '--allow-env',
            '--allow-read',
            '--allow-run',
            '--allow-write',
            new File(mainWorkerDirectory, 'scripts/bundle.ts').absolutePath,
            '--static-dir',
            releaseStaticDirectory.get().asFile.absolutePath,
            '--output',
            mainWorkerEszip.get().asFile.absolutePath)

    doFirst {
        mainWorkerEszip.get().asFile.parentFile.mkdirs()
        releaseStaticDirectory.get().asFile.parentFile.mkdirs()
    }
}

def bundleEventWorker = tasks.register('bundleEventWorkerEszip', Exec) {
    group = 'distribution'
    description = 'Bundles the Event Worker into an ESZip for releaseBuild.'
    dependsOn(prepareRuntimeForBundling)
    workingDir(eventWorkerDirectory)
    inputs.files(typescriptSources, runtimeForBundling)
    outputs.file(eventWorkerEszip)
    environment('EDGE_RUNTIME_BIN', runtimeForBundling.absolutePath)
    commandLine(
            'deno',
            'run',
            '--allow-env',
            '--allow-read',
            '--allow-run',
            '--allow-write',
            new File(eventWorkerDirectory, 'scripts/bundle.ts').absolutePath,
            '--output',
            eventWorkerEszip.get().asFile.absolutePath)

    doFirst {
        eventWorkerEszip.get().asFile.parentFile.mkdirs()
    }
}

def generateRuntimeManifest = tasks.register('generateRuntimeManifest') {
    group = 'distribution'
    description = 'Generates metadata and checksums for the downloaded Runtime.'
    dependsOn(bundleMainWorker, bundleEventWorker)
    inputs.property('modVersion', project.version)
    inputs.property('runtimeRelease', runtimeRelease)
    outputs.file(runtimeManifest)

    doLast {
        String platforms = runtimeRelease.platforms.collect { platform, specification ->
            """    "${platform}": {
      "asset": "${specification.asset}",
      "sha256": "${specification.sha256}"
    }"""
        }.join(',\n')
        File manifest = runtimeManifest.get().asFile
        manifest.parentFile.mkdirs()
        manifest.setText("""{
  "schemaVersion": 3,
  "modVersion": "${project.version}",
  "release": {
    "repository": "${runtimeRelease.repository}",
    "tag": "${runtimeRelease.tag}"
  },
  "platforms": {
${platforms}
  }
}
""", 'UTF-8')
    }
}

def stageReleaseResources = tasks.register('stageReleaseResources', Sync) {
    group = 'distribution'
    description = 'Stages Runtime release metadata and worker ESZips under their stable JAR resource paths.'
    dependsOn(bundleMainWorker, bundleEventWorker, generateRuntimeManifest)
    into(releaseResourcesDirectory)
    from(mainWorkerEszip) {
        into('cobbleware/workers')
    }
    from(eventWorkerEszip) {
        into('cobbleware/workers')
    }
    from(runtimeManifest) {
        into('cobbleware/runtime')
    }
}

tasks.named('runServer') {
    dependsOn(stageReleaseResources)
    classpath.from(releaseResourcesDirectory)
    if (useLocalRuntime.get()) {
        jvmArgs("-Dcobbleware.localRuntime=${localRuntimeBinary.absolutePath}")
    }
}

sourceSets {
    main {
        proto {
            srcDir '../../protobuf'
        }
    }
    callGraph {
        java {
            srcDir 'src/callgraph/java'
        }
    }
}

def callGraphClassName = providers.gradleProperty('callGraphClass').orElse('')
def callGraphIncludeExternalCallees = providers.gradleProperty('callGraphIncludeExternalCallees').orElse('false')
def callGraphOutput = layout.buildDirectory.file(callGraphClassName.map { className ->
    "reports/call-graphs/${className.isEmpty() ? 'missing-class-name' : className}.dot"
})

tasks.register('buildCallGraph', JavaExec) {
    group = 'verification'
    description = 'Builds a call graph for -PcallGraphClass=<fully.qualified.ClassName>; external callees are opt-in.'
    dependsOn(tasks.named('classes'), tasks.named('compileCallGraphJava'))
    classpath = sourceSets.callGraph.runtimeClasspath
    mainClass = 'io.github.mmcgill.cobbleware.tools.CallGraphBuilder'
    inputs.property('callGraphClass', callGraphClassName)
    inputs.property('callGraphIncludeExternalCallees', callGraphIncludeExternalCallees)
    outputs.file(callGraphOutput)

    doFirst {
        String className = callGraphClassName.get()
        if (className.isEmpty()) {
            throw new GradleException('buildCallGraph requires -PcallGraphClass=<fully.qualified.ClassName>.')
        }
        args(
                project.projectDir.absolutePath,
                sourceSets.main.allJava.srcDirs.collect { it.absolutePath }.join(File.pathSeparator),
                (sourceSets.main.compileClasspath + sourceSets.main.output).asPath,
                callGraphOutput.get().asFile.absolutePath,
                className,
                callGraphIncludeExternalCallees.get())
    }
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/callgraph/java/**/*.java'
        palantirJavaFormat '2.91.0'
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${project.protobuf_version}"
    }
}

tasks.register('generateCobblewareProtos') {
    group = 'build'
    description = 'Generates Java bindings from the repository-wide Cobbleware protobuf schemas.'
    dependsOn(tasks.named('generateProto'))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

def releaseJar = tasks.register('releaseJar', Jar) {
    group = 'distribution'
    description = 'Creates the Cobbleware release JAR with pinned Runtime download metadata.'
    archiveClassifier.set('release')
    dependsOn(tasks.named('classes'), stageReleaseResources)
    from(sourceSets.main.output)
    from(releaseResourcesDirectory)
}

tasks.register('releaseBuild') {
    group = 'distribution'
    description = 'Builds a Cobbleware release JAR using Windows Runtime tooling.'
    dependsOn(releaseJar)
}
