plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.google.protobuf' version "${protobuf_gradle_plugin_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
}

sourceSets {
    main {
        proto {
            srcDir '../../protobuf'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${project.protobuf_version}"
    }
}

tasks.register('generateCobblewareProtos') {
    group = 'build'
    description = 'Generates Java bindings from the repository-wide Cobbleware protobuf schemas.'
    dependsOn(tasks.named('generateProto'))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
