name: Build Cobbleware Mod

run-name: Cobbleware mod ${{ github.sha }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      jar_name: ${{ steps.identity.outputs.jar_name }}
      mod_version: ${{ steps.identity.outputs.mod_version }}
      is_snapshot: ${{ steps.identity.outputs.is_snapshot }}
      sha256: ${{ steps.package.outputs.sha256 }}
      size: ${{ steps.package.outputs.size }}

    steps:
      - name: Check out Cobbleware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Record release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' java/cobbleware/gradle.properties)"
          test "$(printf '%s\n' "$mod_version" | wc -l)" -eq 1
          test -n "$mod_version"

          is_snapshot=false
          if [[ "${mod_version^^}" == *SNAPSHOT* ]]; then
            is_snapshot=true
          fi

          {
            echo "artifact_name=cobbleware-mod-${GITHUB_SHA:0:12}"
            echo "jar_name=cobbleware-${mod_version}-release.jar"
            echo "mod_version=$mod_version"
            echo "is_snapshot=$is_snapshot"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Build and test release JAR
        working-directory: java/cobbleware
        shell: bash
        run: bash ./gradlew --no-daemon test releaseBuild

      - name: Verify and package release JAR
        id: package
        shell: bash
        env:
          JAR_NAME: ${{ steps.identity.outputs.jar_name }}
          MOD_VERSION: ${{ steps.identity.outputs.mod_version }}
        run: |
          set -euo pipefail
          jar="java/cobbleware/build/libs/$JAR_NAME"
          test -f "$jar"
          test "$(find java/cobbleware/build/libs -maxdepth 1 -type f -name '*-release.jar' | wc -l)" -eq 1
          unzip -Z1 "$jar" | grep --fixed-strings --quiet 'cobbleware/runtime/manifest.json'
          unzip -Z1 "$jar" | grep --fixed-strings --quiet 'cobbleware/workers/main-worker.eszip'
          unzip -Z1 "$jar" | grep --fixed-strings --quiet 'cobbleware/workers/event-worker.eszip'
          test "$(unzip -p "$jar" cobbleware/runtime/manifest.json | jq --raw-output '.modVersion')" = "$MOD_VERSION"
          test "$(unzip -p "$jar" fabric.mod.json | jq --raw-output '.version')" = "$MOD_VERSION"

          release_dir="$RUNNER_TEMP/cobbleware-mod-release"
          mkdir --parents "$release_dir"
          cp "$jar" "$release_dir/$JAR_NAME"
          (
            cd "$release_dir"
            sha256sum "$JAR_NAME" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          sha256="$(sha256sum "$release_dir/$JAR_NAME" | cut -d ' ' -f 1)"
          size="$(stat --format=%s "$release_dir/$JAR_NAME")"
          {
            echo "directory=$release_dir"
            echo "sha256=$sha256"
            echo "size=$size"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Cobbleware mod build"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`$MOD_VERSION\`"
            echo "- Artifact: \`$JAR_NAME\` ($size bytes)"
            echo "- SHA-256: \`$sha256\`"
            if [[ "${{ steps.identity.outputs.is_snapshot }}" == true ]]; then
              echo "- Publishing: skipped because the checked-in version is a snapshot."
            elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "- Publishing: skipped because this dispatch did not run from \`main\`."
            else
              echo "- Publishing: eligible."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.directory }}/${{ steps.identity.outputs.jar_name }}
            ${{ steps.package.outputs.directory }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: Publish mod release
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.is_snapshot == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check release tag is unused
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-${{ needs.build.outputs.mod_version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG" >&2
            exit 1
          fi
          if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A tag already exists for $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download release JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cobbleware-mod-release

      - name: Verify release assets
        id: assets
        shell: bash
        env:
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/cobbleware-mod-release"
          test -f "$release_dir/$JAR_NAME"
          test -f "$release_dir/SHA256SUMS"
          (
            cd "$release_dir"
            sha256sum --check SHA256SUMS
          )
          sha256="$(sha256sum "$release_dir/$JAR_NAME" | cut -d ' ' -f 1)"
          size="$(stat --format=%s "$release_dir/$JAR_NAME")"
          test "$sha256" = "$EXPECTED_SHA256"
          test "$size" = "$EXPECTED_SIZE"

          notes="$RUNNER_TEMP/cobbleware-mod-release/release-notes.md"
          cat > "$notes" <<EOF
          Cobbleware mod version \`${{ needs.build.outputs.mod_version }}\`, built from commit \`$GITHUB_SHA\`.

          | Asset | Size (bytes) | SHA-256 |
          | --- | ---: | --- |
          | \`$JAR_NAME\` | $size | \`$sha256\` |

          \`SHA256SUMS\` contains the checksum in a format suitable for \`sha256sum --check\`.
          EOF
          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-${{ needs.build.outputs.mod_version }}
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
          RELEASE_DIRECTORY: ${{ steps.assets.outputs.directory }}
          RELEASE_NOTES: ${{ steps.assets.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cobbleware $MOD_VERSION" \
            --notes-file "$RELEASE_NOTES" \
            --draft \
            "$RELEASE_DIRECTORY/$JAR_NAME" \
            "$RELEASE_DIRECTORY/SHA256SUMS"

      - name: Verify draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-${{ needs.build.outputs.mod_version }}
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets,url)"
          test "$(jq --raw-output '.isDraft' <<< "$release")" = true
          test "$(jq --raw-output '.targetCommitish' <<< "$release")" = "$GITHUB_SHA"
          test "$(jq '.assets | length' <<< "$release")" = 2
          jq --exit-status \
            --arg name "$JAR_NAME" \
            --arg sha "sha256:$EXPECTED_SHA256" \
            --argjson size "$EXPECTED_SIZE" \
            'any(.assets[]; .name == $name and .size == $size and .digest == $sha)' \
            <<< "$release" >/dev/null
          jq --exit-status 'any(.assets[]; .name == "SHA256SUMS")' <<< "$release" >/dev/null

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-${{ needs.build.outputs.mod_version }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Write release summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-${{ needs.build.outputs.mod_version }}
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url)"
          test "$(jq --raw-output '.isDraft' <<< "$release")" = false
          release_url="$(jq --raw-output '.url' <<< "$release")"
          {
            echo "## Published Cobbleware mod release"
            echo
            echo "- Release: [$RELEASE_TAG]($release_url)"
            echo "- Version: \`${{ needs.build.outputs.mod_version }}\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Artifact: \`$JAR_NAME\` ($EXPECTED_SIZE bytes, SHA-256 \`$EXPECTED_SHA256\`)"
          } >> "$GITHUB_STEP_SUMMARY"
