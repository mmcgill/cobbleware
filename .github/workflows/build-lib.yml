name: Build Cobbleware TypeScript library

run-name: Cobbleware TypeScript library ${{ github.sha }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build library package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      package_name: ${{ steps.identity.outputs.package_name }}
      package_version: ${{ steps.identity.outputs.package_version }}
      tarball_name: ${{ steps.identity.outputs.tarball_name }}
      dist_tag: ${{ steps.identity.outputs.dist_tag }}
      sha256: ${{ steps.package.outputs.sha256 }}
      size: ${{ steps.package.outputs.size }}

    steps:
      - name: Check out Cobbleware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Record release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          config=typescript/cobbleware/deno.json
          package_name="$(jq --raw-output '.name // empty' "$config")"
          configured_version="$(jq --raw-output '.version // empty' "$config")"
          test "$package_name" = '@cobbleware/core'
          test -n "$configured_version"

          if [[ "$configured_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-alpha$ ]]; then
            package_version="${configured_version}.${GITHUB_RUN_NUMBER}"
            dist_tag=alpha
          elif [[ "$configured_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            package_version="$configured_version"
            dist_tag=latest
          else
            echo "deno.json version must be X.Y.Z or X.Y.Z-alpha; got: $configured_version" >&2
            exit 1
          fi

          tarball_name="${package_name#@}"
          tarball_name="${tarball_name//\//-}-${package_version}.tgz"
          artifact_name="cobbleware-core-${GITHUB_SHA:0:12}"
          {
            echo "artifact_name=$artifact_name"
            echo "package_name=$package_name"
            echo "package_version=$package_version"
            echo "tarball_name=$tarball_name"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Check formatting
        working-directory: typescript/cobbleware
        shell: bash
        run: deno fmt --check --ignore=generated

      - name: Check library
        working-directory: typescript/cobbleware
        shell: bash
        run: deno task check

      - name: Test library
        working-directory: typescript/cobbleware
        shell: bash
        run: deno task test

      - name: Package library
        working-directory: typescript/cobbleware
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.package_version }}
        run: deno task pack --version "$PACKAGE_VERSION"

      - name: Verify and package release tarball
        id: package
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.package_version }}
          TARBALL_NAME: ${{ steps.identity.outputs.tarball_name }}
        run: |
          set -euo pipefail
          tarball="typescript/cobbleware/$TARBALL_NAME"
          test -f "$tarball"

          contents="$(tar -tzf "$tarball")"
          for path in \
            package/package.json \
            package/README.md \
            package/LICENSE \
            package/src/mod.js \
            package/src/mod.d.ts \
            package/generated/internal_pb.js \
            package/generated/internal_pb.d.ts; do
            grep --fixed-strings --line-regexp --quiet "$path" <<< "$contents"
          done

          manifest="$(tar -xOf "$tarball" package/package.json)"
          jq --exit-status \
            --arg name "$PACKAGE_NAME" \
            --arg version "$PACKAGE_VERSION" \
            --arg repository 'git+https://github.com/mmcgill/cobbleware.git' \
            --arg homepage 'https://github.com/mmcgill/cobbleware/tree/main/typescript/cobbleware' \
            '.name == $name and .version == $version and .repository.type == "git" and
             .repository.url == $repository and .repository.directory == "typescript/cobbleware" and
             .homepage == $homepage' \
            <<< "$manifest" >/dev/null

          release_dir="$RUNNER_TEMP/cobbleware-core-release"
          mkdir --parents "$release_dir"
          cp "$tarball" "$release_dir/$TARBALL_NAME"
          (
            cd "$release_dir"
            sha256sum "$TARBALL_NAME" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          sha256="$(sha256sum "$release_dir/$TARBALL_NAME" | cut -d ' ' -f 1)"
          size="$(stat --format=%s "$release_dir/$TARBALL_NAME")"
          {
            echo "directory=$release_dir"
            echo "sha256=$sha256"
            echo "size=$size"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Cobbleware TypeScript library build"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Package: \`$PACKAGE_NAME\`"
            echo "- Version: \`$PACKAGE_VERSION\`"
            echo "- Artifact: \`$TARBALL_NAME\` ($size bytes)"
            echo "- SHA-256: \`$sha256\`"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo "- NPM dist-tag: \`${{ steps.identity.outputs.dist_tag }}\`"
              echo "- NPM staging: eligible."
            else
              echo "- NPM staging: skipped because this dispatch did not run from \`main\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.directory }}/${{ steps.identity.outputs.tarball_name }}
            ${{ steps.package.outputs.directory }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  stage-npm-package:
    name: Stage npm package
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm
        shell: bash
        run: npm install --global npm@12.2.0

      - name: Download release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cobbleware-core-release

      - name: Verify and stage npm package
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          TARBALL_NAME: ${{ needs.build.outputs.tarball_name }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/cobbleware-core-release"
          test -f "$release_dir/$TARBALL_NAME"
          test -f "$release_dir/SHA256SUMS"
          (
            cd "$release_dir"
            sha256sum --check SHA256SUMS
          )
          sha256="$(sha256sum "$release_dir/$TARBALL_NAME" | cut -d ' ' -f 1)"
          size="$(stat --format=%s "$release_dir/$TARBALL_NAME")"
          test "$sha256" = "$EXPECTED_SHA256"
          test "$size" = "$EXPECTED_SIZE"

          npm --version
          npm stage publish "$release_dir/$TARBALL_NAME" --access public --tag "$DIST_TAG"
          {
            echo "## Staged npm package"
            echo
            echo "- Package: \`$PACKAGE_NAME@$PACKAGE_VERSION\`"
            echo "- Dist-tag: \`$DIST_TAG\`"
            echo "- A maintainer must approve this staged package in npm before it is publicly installable."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish library release
    needs: [build, stage-npm-package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check release tag is unused
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-core-${{ needs.build.outputs.package_version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG" >&2
            exit 1
          fi
          if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A tag already exists for $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cobbleware-core-release

      - name: Verify release assets
        id: assets
        shell: bash
        env:
          TARBALL_NAME: ${{ needs.build.outputs.tarball_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/cobbleware-core-release"
          test -f "$release_dir/$TARBALL_NAME"
          test -f "$release_dir/SHA256SUMS"
          (
            cd "$release_dir"
            sha256sum --check SHA256SUMS
          )
          sha256="$(sha256sum "$release_dir/$TARBALL_NAME" | cut -d ' ' -f 1)"
          size="$(stat --format=%s "$release_dir/$TARBALL_NAME")"
          test "$sha256" = "$EXPECTED_SHA256"
          test "$size" = "$EXPECTED_SIZE"

          notes="$release_dir/release-notes.md"
          cat > "$notes" <<EOF
          Cobbleware TypeScript library package \`${{ needs.build.outputs.package_name }}\` version \`${{ needs.build.outputs.package_version }}\`, built from commit \`$GITHUB_SHA\`.

          | Asset | Size (bytes) | SHA-256 |
          | --- | ---: | --- |
          | \`$TARBALL_NAME\` | $size | \`$sha256\` |

          \`SHA256SUMS\` contains the checksum in a format suitable for \`sha256sum --check\`.
          EOF
          {
            echo "directory=$release_dir"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-core-${{ needs.build.outputs.package_version }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          TARBALL_NAME: ${{ needs.build.outputs.tarball_name }}
          RELEASE_DIRECTORY: ${{ steps.assets.outputs.directory }}
          RELEASE_NOTES: ${{ steps.assets.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cobbleware TypeScript library $PACKAGE_VERSION" \
            --notes-file "$RELEASE_NOTES" \
            --draft \
            --latest=false \
            "$RELEASE_DIRECTORY/$TARBALL_NAME" \
            "$RELEASE_DIRECTORY/SHA256SUMS"

      - name: Verify draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-core-${{ needs.build.outputs.package_version }}
          TARBALL_NAME: ${{ needs.build.outputs.tarball_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets)"
          test "$(jq --raw-output '.isDraft' <<< "$release")" = true
          test "$(jq --raw-output '.targetCommitish' <<< "$release")" = "$GITHUB_SHA"
          test "$(jq '.assets | length' <<< "$release")" = 2
          jq --exit-status \
            --arg name "$TARBALL_NAME" \
            --arg sha "sha256:$EXPECTED_SHA256" \
            --argjson size "$EXPECTED_SIZE" \
            'any(.assets[]; .name == $name and .size == $size and .digest == $sha)' \
            <<< "$release" >/dev/null
          jq --exit-status 'any(.assets[]; .name == "SHA256SUMS")' <<< "$release" >/dev/null

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-core-${{ needs.build.outputs.package_version }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

      - name: Write release summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cobbleware-core-${{ needs.build.outputs.package_version }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          TARBALL_NAME: ${{ needs.build.outputs.tarball_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url)"
          test "$(jq --raw-output '.isDraft' <<< "$release")" = false
          release_url="$(jq --raw-output '.url' <<< "$release")"
          {
            echo "## Published Cobbleware TypeScript library release"
            echo
            echo "- Release: [$RELEASE_TAG]($release_url)"
            echo "- Package: \`$PACKAGE_NAME\` version \`$PACKAGE_VERSION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Artifact: \`$TARBALL_NAME\` ($EXPECTED_SIZE bytes, SHA-256 \`$EXPECTED_SHA256\`)"
          } >> "$GITHUB_STEP_SUMMARY"
